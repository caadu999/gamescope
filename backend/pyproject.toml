[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Cadu",email = "cadums013@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.taskipy.tasks]
run = "fastapi dev src/backend/app.py"
pre_format = "ruff check --fix"
format = "ruff format"
